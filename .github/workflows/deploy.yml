name: Deploy Eways

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: eways-radiba-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          for name in FTP_HOST FTP_USERNAME FTP_PASSWORD DB_USER DB_PASSWORD ADMIN_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Required secret $name is missing"
              exit 1
            fi
          done

      - name: Create server configuration
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          php -r '
            $config = [
              "db_host" => getenv("DB_HOST") ?: "localhost",
              "db_name" => getenv("DB_NAME") ?: "radiba_eways",
              "db_user" => getenv("DB_USER"),
              "db_password" => getenv("DB_PASSWORD"),
              "admin_username" => getenv("ADMIN_USERNAME") ?: "admin",
              "admin_password" => getenv("ADMIN_PASSWORD"),
              "max_video_bytes" => 134217728,
            ];
            file_put_contents("app/config.local.php", "<?php\nreturn " . var_export($config, true) . ";\n");
          '

      - name: Install FTP client
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Prepare flat document-root package
        run: |
          rm -rf .deploy
          mkdir -p .deploy/app
          cp -a public/. .deploy/
          cp -a app/. .deploy/app/

      - name: Download legacy media for final migration
        run: |
          mkdir -p .deploy/media/videos .deploy/media/posters
          curl --fail --silent --show-error --location --retry 3 \
            "https://eways.kharjeto.ir/api.php?action=catalog" \
            --output /tmp/eways-legacy-catalog.json
          jq -r '.videos[] | .video_path, .poster_path // empty' /tmp/eways-legacy-catalog.json | while IFS= read -r path; do
            case "$path" in
              /media/videos/*|/media/posters/*)
                destination=".deploy${path}"
                mkdir -p "$(dirname "$destination")"
                curl --fail --silent --show-error --location --retry 3 \
                  --connect-timeout 20 --max-time 600 \
                  "https://eways.kharjeto.ir${path}" \
                  --output "$destination"
                ;;
            esac
          done

      - name: Deploy to cPanel
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          lftp -c "
            set ftp:ssl-force false;
            set ftp:ssl-protect-data false;
            set ssl:verify-certificate false;
            set net:max-retries 2;
            open -u \"$FTP_USERNAME\",\"$FTP_PASSWORD\" \"$FTP_HOST\";
            cd \"${FTP_SERVER_DIR:-/}\";
            mirror --reverse --verbose --only-newer --exclude-glob media/videos/*.mp4 --exclude-glob media/posters/*.jpg --exclude-glob media/posters/*.jpeg --exclude-glob media/posters/*.png --exclude-glob media/posters/*.webp .deploy/ ./;
            mkdir -p media/videos;
            mkdir -p media/posters;
            mirror --reverse --verbose --only-newer .deploy/media/videos/ media/videos/;
            mirror --reverse --verbose --only-newer .deploy/media/posters/ media/posters/;
            chmod 755 media media/videos media/posters app;
            rm -r public;
            set cmd:fail-exit no;
            rm README.md;
            rm .gitignore;
            set cmd:fail-exit yes;
            bye;
          "
